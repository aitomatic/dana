# =============================================================================
# Monorepo Workspace - Virtual Root (Not a Package)
# =============================================================================
# This is a virtual workspace root that coordinates the Dana packages:
#   - dana
#   - dana_lang
#   - dana_studio
#
# This root directory is NOT itself a package.
# =============================================================================

[project]
name = "dana-workspace"
version = "0.0.0"  # Virtual workspace - real versions are in sub-packages
description = "Dana Monorepo Workspace - Virtual Root"
requires-python = ">=3.12"
dependencies = [
    # Workspace members
    "dana",
    "dana_lang",
    "dana_studio",
    # Common dev tools
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
    "pytest-cov",
    "ruff>=0.13.0",
    "mypy>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "pexpect",
    "textual-dev>=1.7.0",
    "build>=1.3.0",
    "twine>=6.1.0",
]

docs = [
    "mkdocs",
    "mkdocs-material",
]

# Command-line entry points
[project.scripts]
dana-agent = "dana.apps.dana.__main__:main"
dana-agent-repl = "dana.apps.repl.__main__:main"
dana-lang = "dana_lang.apps.cli.__main__:main"
dana-lsp = "dana_lang.core.lang.lsp.server:main"

# =============================================================================
# Package Manager Configuration (uv)
# =============================================================================

[tool.uv]
package = false                      # This is NOT a package, just a workspace coordinator
preview = true                       # Enable preview features
resolution = "highest"               # Use highest compatible versions
prerelease = "allow"                 # Allow pre-release versions
python-preference = "only-managed"   # Use uv-managed Python installations
compile-bytecode = true              # Pre-compile .pyc files for performance

# Workspace configuration
[tool.uv.workspace]
members = [
    "dana_agent",
    "dana_lang",
    "dana_studio",
]

[tool.uv.sources]
# Workspace member sources
dana = { workspace = true }
dana_lang = { workspace = true }
dana_studio = { workspace = true }

# =============================================================================
# Code Quality Tools
# =============================================================================

[tool.black]
line-length = 140
target-version = ["py312"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",    # bugbear (common Python gotchas)
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python features)
    "N801", # naming conventions - class names
    "N803", # naming conventions - argument names
    "N804", # naming conventions - first argument names
    "F401", # unused imports
    "F821", # undefined names
    "F822", # undefined names in __all__
    "F841", # unused variables
]

ignore = [
    "B008",   # Function call in default argument
    "B010",   # setattr in class body
    "B024",   # Abstract base class without abstract methods (design pattern choice)
    "B904",   # raise ... from ...
    "E203",   # Whitespace before ':' (conflicts with Black)
    "E402",   # Module level import not at top of file (intentional in CLI)
    "E501",   # Line too long (handled by line-length)
    "F403",   # import * used; unable to detect undefined names (acceptable in __init__.py)
    "I001",   # import block is un-sorted or un-formatted
    "N802",   # Function name should be lowercase
    "UP007",  # use `X | Y` for type annotations,
    "UP035", # deprecated import
]

extend-select = [
    "I"
]

exclude = [
    "*.na",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "dana.egg-info",
    "**/.archived/**",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-single-line = false
lines-after-imports = 2
known-third-party = [
    "openai",
    "anthropic",
    "httpx",
    "structlog",
    "tqdm",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "ruff",
    "matplotlib",
    "pandas",
    "mypy",
    "build",
    "twine",
    "mkdocs",
    "mkdocs-material",
    "requests",
    "bs4",
    "lxml",
    "readability",
    "html2text",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.pyright]
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
reportAssignmentType = false

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "dana.core.lang.interpreter.*"
disallow_untyped_defs = true

# Database Migration Tool FOR DANA STUDIO
[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/dana/api/alembic"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library and tzdata library.
# Any required deps can installed by adding `alembic[tz]` to the pip requirements
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
