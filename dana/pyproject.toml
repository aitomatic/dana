# Dana - Backward Compatibility Shim
# Copyright © 2025 Aitomatic, Inc. Licensed under the MIT License.
#
# This package provides backward compatibility for code using 'import dana'.
# New code should use 'import dana_lang' directly.

[project]
name = "dana"
version = "0.6.0.1rc3"
description = "Dana Language - Backward compatibility shim (use dana_lang)"
requires-python = ">=3.12"
dependencies = [
    "dana_lang>=0.6.0",
]
authors = [
    {name = "Christopher Nguyen", email = "ctn@aitomatic.com"}
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/aitomatic/dana-internal"
Repository = "https://github.com/aitomatic/dana-internal"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dana*"]

