# =============================================================================
# Build System Configuration
# =============================================================================

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "dana_studio"
version = "0.6.0.1rc3"
description = "Dana Studio - Web-based IDE for Dana Language Development"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Christopher Nguyen", email = "ctn@aitomatic.com" }]
maintainers = [
    { name = "Vinh Luong", email = "vinh@aitomatic.com" },
    { name = "Annie Ha", email = "annie@aitomatic.com" },
    { name = "Lam Nguyen", email = "lam@aitomatic.com" },
    { name = "Roy Vu", email = "roy@aitomatic.com" },
    { name = "Sang Dinh", email = "sang@aitomatic.com" },
]

# Core runtime dependencies for Dana Studio
dependencies = [
    # Cross-project dependencies
    "dana_lang",
    "dana_agent",
    # Web framework
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    # Development tools
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# Command-line entry points
[project.scripts]
dana-studio = "dana_studio.server:main"

# Optional dependency groups
[project.optional-dependencies]
dev = [
    # Testing framework
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Code quality tools
    "ruff>=0.13.0",
    "mypy>=1.8.0",
    "pre-commit>=4.3.0",
    # Package management
    "build>=1.0.0",
    "twine>=5.0.0",
]

# =============================================================================
# Package Configuration
# =============================================================================

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["dana_studio*"]
exclude = ["tests*", "examples*", "docs*", "tmp*"]

[tool.setuptools.package-data]
"*" = [
    "**/*.py",
    "**/*.html",
    "**/*.css",
    "**/*.js",
    "**/*.json",
]

# =============================================================================
# Package Manager Configuration (uv)
# =============================================================================

[tool.uv]
package = true
preview = true
resolution = "highest"
prerelease = "allow"
python-preference = "only-managed"
compile-bytecode = true

[tool.uv.sources]
# Future: Custom dependency sources

# =============================================================================
# Code Quality Tools
# =============================================================================

[tool.black]
line-length = 140
target-version = ["py312"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",    # bugbear (common Python gotchas)
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python features)
    "N801", # naming conventions - class names
    "N803", # naming conventions - argument names
    "N804", # naming conventions - first argument names
    "F401", # unused imports
    "F821", # undefined names
    "F822", # undefined names in __all__
    "F841", # unused variables
]

ignore = [
    "B008",  # Function call in default argument
    "B010",  # setattr in class body
    "B024",  # Abstract base class without abstract methods (design pattern choice)
    "B904",  # raise ... from ...
    "E203",  # Whitespace before ':' (conflicts with Black)
    "E402",  # Module level import not at top of file (intentional in CLI)
    "E501",  # Line too long (handled by line-length)
    "F403",  # import * used; unable to detect undefined names (acceptable in __init__.py)
    "N802",  # Function name should be lowercase
    "UP007", # use `X | Y` for type annotations
]

exclude = [
    "*.na",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "dana.egg-info",
    "**/.archived/**",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-single-line = false
lines-after-imports = 2
known-first-party = ["dana_studio"]
known-third-party = [
    "fastapi",
    "uvicorn",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "ruff",
    "mypy",
    "build",
    "twine",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.pyright]
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
reportAssignmentType = false

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
